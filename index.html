<!DOCTYPE html>
<html lang="en" class="bg-[#050505]">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Should I Buy It?</title>
<meta name="description" content="Turn a purchase price into working time.">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Should I Buy It">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#050505;overscroll-behavior:none}body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 0%,rgba(16,185,129,.14),transparent 30%),radial-gradient(circle at 95% 20%,rgba(59,130,246,.07),transparent 27%),linear-gradient(180deg,#050505,#070707 52%,#050505)}[x-cloak]{display:none!important}input{font:inherit}input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.glass{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 55px rgba(0,0,0,.28)}.result{background:radial-gradient(circle at 88% 5%,rgba(16,185,129,.18),transparent 35%),linear-gradient(150deg,rgba(6,78,59,.28),rgba(12,12,12,.86) 50%,rgba(8,8,8,.96));border:1px solid rgba(52,211,153,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 42px rgba(16,185,129,.03),0 18px 65px rgba(0,0,0,.45),0 10px 36px rgba(16,185,129,.06);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}.line{height:1px;margin-left:52px;background:rgba(255,255,255,.075)}.icon{background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.08)}.lang{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.075)}.lang-on{background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.09));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.22);color:#fff}.share{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.18s}.share:active{transform:scale(.96)}.sticky-glass{background:rgba(10,10,10,.60);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%)}input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:999px;background:linear-gradient(90deg,#10b981,#34d399);outline:none}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:23px;height:23px;border-radius:999px;background:#fff;border:4px solid #10b981;box-shadow:0 0 0 5px rgba(16,185,129,.08),0 5px 16px rgba(0,0,0,.5)}@supports(padding:max(0px)){.safe-b{padding-bottom:max(20px,env(safe-area-inset-bottom))}}
</style>
</head>
<body class="text-white">
<main x-data="app()" :lang="lang" class="relative mx-auto min-h-[100dvh] w-full max-w-md safe-b">
<header class="sticky top-0 z-50 border-b border-white/5 bg-neutral-950/60 pt-[env(safe-area-inset-top)] backdrop-blur-xl">
  <div class="flex h-[58px] items-center justify-between px-5">
    <div class="flex min-w-0 items-center gap-2.5">
      <img src="icon.png" alt="Logo" class="h-7 w-7 rounded-md shadow-sm">
      <span class="truncate text-[15px] font-semibold tracking-tight text-white">Should I Buy It</span>
    </div>
    <div class="lang flex shrink-0 rounded-full p-[3px]">
      <button type="button" @click="lang='en'" :class="lang==='en'?'lang-on':'text-neutral-500'" class="rounded-full px-3 py-1.5 text-[11px] font-semibold">EN</button>
      <button type="button" @click="lang='de'" :class="lang==='de'?'lang-on':'text-neutral-500'" class="rounded-full px-3 py-1.5 text-[11px] font-semibold">DE</button>
    </div>
  </div>
</header>
<div class="flex min-h-[100dvh] flex-col px-5 pt-6">
<section class="pb-5">
<p class="mb-2 text-[12px] font-semibold uppercase tracking-[.15em] text-emerald-400" x-text="t('eyebrow')"></p>
<h1 class="max-w-[325px] text-[2.5rem] font-bold leading-[.98] tracking-[-.055em]"><span x-text="t('title1')"></span><span class="text-neutral-500" x-text="t('title2')"></span></h1>
<p class="mt-3 max-w-[335px] text-[14px] leading-[1.55] text-neutral-400" x-text="t('subtitle')"></p>
</section>
<section class="glass overflow-hidden rounded-[24px]">
<div class="flex min-h-[64px] items-center gap-3 px-4"><div class="icon flex h-9 w-9 items-center justify-center rounded-[11px]">🛍</div><div class="min-w-0 flex-1 py-3"><label class="mb-[3px] block text-[11px] text-neutral-500" x-text="t('productLabel')"></label><input x-model="product" :placeholder="t('productPlaceholder')" class="w-full bg-transparent text-[16px] font-medium outline-none placeholder:text-neutral-700"></div></div>
<div class="line"></div>
<div class="flex min-h-[64px] items-center gap-3 px-4"><div class="icon flex h-9 w-9 items-center justify-center rounded-[11px] font-semibold" x-text="currencySymbol"></div><div class="min-w-0 flex-1 py-3"><label class="mb-[3px] block text-[11px] text-neutral-500" x-text="t('priceLabel')"></label><div class="flex items-center"><span class="mr-1 text-neutral-500" x-text="currencySymbol"></span><input x-model="price" type="number" inputmode="decimal" min="0" step="0.01" :placeholder="t('pricePlaceholder')" class="min-w-0 flex-1 bg-transparent text-[16px] font-medium tabular-nums outline-none placeholder:text-neutral-700"></div></div></div>
<div class="line"></div>
<div class="px-4 py-3.5"><div class="flex items-center gap-3"><div class="icon flex h-9 w-9 items-center justify-center rounded-[11px]">#</div><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-4"><div><label class="block text-[11px] text-neutral-500" x-text="t('wageLabel')"></label><div class="mt-[3px] flex items-baseline"><span class="mr-1 text-neutral-500" x-text="currencySymbol"></span><input x-model.number="wage" type="number" inputmode="decimal" min="0" step="0.5" class="w-[76px] bg-transparent text-[16px] font-medium tabular-nums outline-none"><span class="ml-1 text-[13px] text-neutral-500" x-text="t('perHour')"></span></div></div><div class="rounded-full border border-white/5 bg-black/20 px-2.5 py-1 text-[11px] text-neutral-400" x-text="`${currencySymbol}${Number(wage||0).toFixed(0)}/h`"></div></div><div class="mt-3"><input x-model.number="wage" type="range" min="5" max="100" step="1"><div class="mt-1.5 flex justify-between text-[10px] text-neutral-700"><span x-text="`${currencySymbol}5`"></span><span x-text="`${currencySymbol}100`"></span></div></div></div></div></div>
</section>
<section class="mt-4"><div class="result relative overflow-hidden rounded-[28px] px-5 py-5"><div class="relative z-10"><div class="flex items-start justify-between gap-4"><div><p class="text-[11px] font-semibold uppercase tracking-[.14em] text-emerald-400" x-text="t('resultEyebrow')"></p><p class="mt-1 text-[13px] text-neutral-500" x-text="t('resultSubtitle')"></p></div><button x-show="valid" x-cloak @click="shareResult()" class="share flex h-10 w-10 items-center justify-center rounded-[13px]" :aria-label="t('share')"><svg viewBox="0 0 24 24" fill="none" class="h-[17px] w-[17px]" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" d="M12 15V3m0 0 4 4m-4-4L8 7"></path><path stroke-linecap="round" d="M6.5 10.5h-1A2.5 2.5 0 003 13v5.5A2.5 2.5 0 005.5 21h13a2.5 2.5 0 002.5-2.5V13a2.5 2.5 0 00-2.5-2.5h-1"></path></svg></button></div>
<div x-show="!valid" class="pb-2 pt-7"><h2 class="max-w-[300px] text-[27px] font-bold leading-[1.08] tracking-[-.035em]"><span x-text="t('emptyTitle1')"></span><span class="text-neutral-500" x-text="t('emptyTitle2')"></span></h2><p class="mt-3 max-w-[290px] text-[13px] leading-5 text-neutral-500" x-text="t('emptyDescription')"></p></div>
<div x-cloak x-show="valid" class="pt-7"><div class="text-[3.85rem] font-bold leading-[.9] tracking-[-.065em]" x-text="formattedTime"></div><div class="mt-4 flex flex-wrap gap-2"><span class="rounded-full border border-white/10 bg-white/[.035] px-2.5 py-1 text-[11px] text-neutral-400" x-text="priceFormatted"></span><span class="rounded-full border border-white/10 bg-white/[.035] px-2.5 py-1 text-[11px] text-neutral-400" x-text="formattedDays"></span></div><p class="mt-4 text-[13px] leading-5 text-neutral-400"><template x-if="product.trim()"><span><span class="font-medium text-neutral-200" x-text="product.trim()"></span><span x-text="t('costsYou')"></span></span></template><template x-if="!product.trim()"><span x-text="t('thisPurchaseCosts')"></span></template><span class="font-semibold text-emerald-400" x-text="formattedTime"></span><span x-text="t('workingTimeSuffix')"></span></p></div></div></div></section>
<section x-cloak x-show="valid" class="glass mt-3 rounded-[22px] px-4 py-4"><p class="text-[13px] font-semibold" x-text="t('beforeBuy')"></p><p class="mt-1 text-[12px] leading-[1.55] text-neutral-500"><span x-text="t('askWorth')"></span><span class="font-medium text-neutral-300" x-text="formattedTime"></span><span x-text="t('ofYourLife')"></span></p></section>
<footer class="mt-auto pt-7 text-center"><p class="text-[10px] font-semibold uppercase tracking-[.14em] text-neutral-700" x-text="t('footer')"></p></footer>
</div>
</main>
<script>
function app(){return{product:'',price:'',wage:Alpine.$persist(20).as('shouldibuyit_wage'),lang:Alpine.$persist('en').as('shouldibuyit_lang'),translations:{en:{eyebrow:'Purchase reality check',title1:'Should I ',title2:'buy it?',subtitle:'See what a purchase really costs — measured in your working time.',productLabel:'Product',productPlaceholder:'e.g. AirPods Pro',priceLabel:'Price',pricePlaceholder:'0.00',wageLabel:'Net hourly wage',perHour:'per hour',resultEyebrow:'Real cost',resultSubtitle:'Your time to afford it',emptyTitle1:'Enter details to ',emptyTitle2:'see the real cost.',emptyDescription:'Your purchase will be translated into hours and minutes of work.',costsYou:' costs you ',thisPurchaseCosts:'This purchase costs you ',workingTimeSuffix:' of working time.',beforeBuy:'Before you buy',askWorth:'Ask yourself whether this is worth ',ofYourLife:' of your life.',workHour:'work hour',workHours:'work hours',workDay:'work day',workDays:'work days',share:'Share result',footer:"Money is replaceable. Time isn't."},de:{eyebrow:'Kauf-Realitätscheck',title1:'Soll ich es ',title2:'kaufen?',subtitle:'Sieh, was ein Kauf wirklich kostet — gemessen in deiner Arbeitszeit.',productLabel:'Produkt',productPlaceholder:'z. B. AirPods Pro',priceLabel:'Preis',pricePlaceholder:'0,00',wageLabel:'Netto-Stundenlohn',perHour:'pro Stunde',resultEyebrow:'Echter Preis',resultSubtitle:'Deine Arbeitszeit dafür',emptyTitle1:'Gib die Daten ein und ',emptyTitle2:'sieh den echten Preis.',emptyDescription:'Der Kaufpreis wird in Stunden und Minuten deiner Arbeitszeit übersetzt.',costsYou:' kostet dich ',thisPurchaseCosts:'Dieser Kauf kostet dich ',workingTimeSuffix:' Arbeitszeit.',beforeBuy:'Bevor du kaufst',askWorth:'Frag dich, ob dir dieser Kauf ',ofYourLife:' deines Lebens wert ist.',workHour:'Arbeitsstunde',workHours:'Arbeitsstunden',workDay:'Arbeitstag',workDays:'Arbeitstage',share:'Ergebnis teilen',footer:'Geld ist ersetzbar. Zeit nicht.'}},t(k){return this.translations[this.lang][k]||k},get currencySymbol(){return this.lang==='de'?'€':'$'},get currencyCode(){return this.lang==='de'?'EUR':'USD'},get locale(){return this.lang==='de'?'de-DE':'en-US'},get valid(){const p=Number(this.price),w=Number(this.wage);return Number.isFinite(p)&&Number.isFinite(w)&&p>0&&w>0},get rawHours(){return this.valid?Number(this.price)/Number(this.wage):0},get totalMinutes(){return this.valid?Math.round(this.rawHours*60):0},get hours(){return Math.floor(this.totalMinutes/60)},get minutes(){return this.totalMinutes%60},get formattedTime(){if(!this.valid)return'';if(this.hours===0)return`${this.minutes}m`;if(this.minutes===0)return`${this.hours}h`;return`${this.hours}h ${this.minutes}m`},get workDays(){return this.valid?this.rawHours/8:0},get formattedDays(){if(!this.valid)return'';const d=this.workDays;if(d<1){const h=Math.round(this.rawHours*10)/10;return`${h.toLocaleString(this.locale,{maximumFractionDigits:1})} ${Math.abs(h-1)<.001?this.t('workHour'):this.t('workHours')}`}const r=d>=10?Math.round(d):Math.round(d*10)/10;return`${r.toLocaleString(this.locale,{maximumFractionDigits:1})} ${Math.abs(r-1)<.001?this.t('workDay'):this.t('workDays')}`},get priceFormatted(){if(!this.valid)return'';return new Intl.NumberFormat(this.locale,{style:'currency',currency:this.currencyCode,maximumFractionDigits:2}).format(Number(this.price))},async shareResult(){if(!this.valid)return;const name=this.product.trim()||(this.lang==='de'?'Dieser Kauf':'This purchase');const text=this.lang==='de'?`${name} kostet mich ${this.formattedTime} meines Lebens. Berechne deine Käufe: ${location.href}`:`The ${name} costs me ${this.formattedTime} of my life. Calculate your purchases: ${location.href}`;try{if(navigator.share){await navigator.share({title:'Should I Buy It?',text,url:location.href});return}await navigator.clipboard.writeText(text)}catch(e){if(e?.name!=='AbortError'){try{await navigator.clipboard.writeText(text)}catch(_){}}}}}}
if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
