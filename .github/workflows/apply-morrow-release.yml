name: Apply Morrow Money v1.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-morrow-release.yml'

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Unpack Morrow Money v1.0
        shell: bash
        run: |
          cat .release/chunk-*.b64 > /tmp/morrow-release.b64
          base64 -d /tmp/morrow-release.b64 > /tmp/morrow-release.tar.gz
          tar -xzf /tmp/morrow-release.tar.gz -C .

      - name: Commit release files
        shell: bash
        run: |
          rm -rf .release
          rm -f .github/workflows/apply-morrow-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Morrow Money v1.0"
          git push origin HEAD:main
